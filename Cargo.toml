[workspace]
resolver = "2"
members = ["crates/hp-core", "crates/hp-log", "crates/hp-track", "crates/hp-proto-banner", "crates/hp-proto-ssh", "crates/hp-bin"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
hp-track = { path = "crates/hp-track" }
hp-core = { path = "crates/hp-core" }
hp-log = { path = "crates/hp-log" }
hp-proto-banner = { path = "crates/hp-proto-banner" }
hp-proto-ssh = { path = "crates/hp-proto-ssh" }
