# SSH honeypot. Port 2222 so it runs unprivileged; use a port forward (or
# CAP_NET_BIND_SERVICE) to expose it as 22.
protocol: ssh
listen:
  - 127.0.0.1:2222
persona:
  hostname: plc-gw-03
  # SSH identification string; must start with "SSH-2.0-".
  banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
track: tracks/ssh-linux-gateway.yaml
limits:
  max_sessions: 256
  session_timeout: 15m
  max_input_bytes: 1MiB
logging:
  json: ./sessions.jsonl
