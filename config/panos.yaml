# HTTPS honeypot posing as a Palo Alto Networks-style edge firewall
# (fw-edge01): management web UI, XML API and GlobalProtect on one listener.
# Port 8443 so it runs unprivileged; forward 443 to it to expose it.
protocol: http
listen:
  - 127.0.0.1:8443
persona:
  hostname: fw-edge01
  # No `banner`: the management interface sends no `Server` header.
track: tracks/http-panos.yaml
tls:
  self_signed:
    names: [fw-edge01, vpn.corp.local]
    organization: "Corp IT"
limits:
  max_sessions: 256
  session_timeout: 2m
  max_input_bytes: 1MiB
logging:
  json: /tmp/panos-sessions.jsonl
