# HTTPS honeypot: the same web console, over TLS. Every connection's TLS
# ClientHello (SNI, ALPN, JA4 fingerprint) is logged before the handshake.
protocol: http
listen:
  - 127.0.0.1:8443
persona:
  hostname: plc-gw-03
  banner: "nginx/1.18.0 (Ubuntu)"
track: tracks/http-ops-portal.yaml
tls:
  # A certificate from your internal CA is far more convincing:
  #   cert: /etc/honeypot/tls/plc-gw-03.pem   # chain, leaf first
  #   key: /etc/honeypot/tls/plc-gw-03.key
  # Otherwise one is generated (backdated, valid ~2 years) at startup:
  self_signed:
    names: [plc-gw-03, plc-gw-03.ot.corp.local]
    organization: "Plant Operations"
limits:
  max_sessions: 256
  session_timeout: 2m
  max_input_bytes: 1MiB
logging:
  json: /tmp/https-sessions.jsonl
