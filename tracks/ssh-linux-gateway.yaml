# Example track for the `ssh` plugin: the *story* only.
#
# The plugin speaks SSH. The emulated host (see `host:` in the config) is the
# machine: filesystem, ~60 commands, prompt, login banner, and the alerts it
# raises (payload_fetch, payload_exec, persistence_attempt, ...). A track says
# who gets in, how it feels, and which moments to flag.
#
#   auth_attempt   reply with `auth: true|false`
#   login: "<user>"   log that user in to the host (sets prompt, prints banner)
#   shell: "<line>"   run a command line on the host and send its output
#   delay / tag / goto / set / close   pacing, extra alerts, state, variables
name: ssh-linux-gateway
vars:
  failed_logins: 0
start: auth

states:
  auth:
    on:
      # The first three password attempts fail, slowly, like a real box.
      - match: { event: auth_attempt }
        when: "failed_logins < 3"
        do:
          - set: { failed_logins: "failed_logins + 1" }
          - delay: 800ms..1500ms
          - auth: false
      # Then let them in.
      - match: { event: auth_attempt }
        do:
          - tag: auth_success
          - delay: 400ms
          - auth: true
          - login: "${user}"
          - goto: shell
    fallback:
      close: true

  shell:
    on:
      # A slow link makes a download feel real; the host does the rest.
      - match: { command: "^(wget|curl)\\b" }
        do:
          - delay: 1s..3s
          - shell: "${command}"
    # Everything else, including `exit`, is the emulated host's job.
    fallback:
      shell: "${command}"
