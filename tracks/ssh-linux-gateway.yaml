# Example track for the `ssh` plugin. The plugin handles the protocol, the
# terminal and the prompt; this file decides who gets in and what commands say.
# - auth_attempt: reply with `auth: true|false`; `send` text sent alongside a
#   successful `auth` is shown as the welcome message when the shell opens.
# - command: one event per shell line or exec request. Use plain "\n"; the
#   plugin converts to tty line endings.
# `fs_add` and the fake filesystem (ls, cat) are not implemented yet; wget/curl
# only flag + fake their output.
name: ssh-linux-gateway
vars:
  failed_logins: 0
  cwd: /home/admin
start: auth

states:
  auth:
    on:
      - match: { event: auth_attempt }
        when: "failed_logins < 3"
        do:
          - set: { failed_logins: "failed_logins + 1" }
          - delay: 800ms..1500ms
          - auth: false
      - match: { event: auth_attempt }
        do:
          - tag: auth_success
          - delay: 400ms
          - auth: true
          - send: "Welcome to Ubuntu 22.04.3 LTS (GNU/Linux 5.15.0-91-generic x86_64)\n\nLast login: Tue Oct 28 09:14:02 2025 from 10.20.0.14\n"
          - goto: shell
    fallback:
      close: true

  shell:
    on:
      - match: { command: "^whoami$" }
        do: [ { send: "admin\n" } ]
      - match: { command: "^uname -a$" }
        do: [ { send: "Linux plc-gw-03 5.15.0-91-generic #101-Ubuntu SMP x86_64 GNU/Linux\n" } ]
      - match: { command: "^cd (?P<dir>\\S+)$" }
        do: [ { set: { cwd: "${dir}" } } ]
      - match: { command: "^pwd$" }
        do: [ { send: "${cwd}\n" } ]
      - match: { command: "^(wget|curl) (?P<url>\\S+)" }
        do:
          - tag: payload_fetch
          - delay: 2s..4s
          - send: "Saving to: '${basename(url)}'\n100%[=====>] 48.2K  --.-KB/s  in 0.3s\n"
      - match: { command: "^(exit|logout)$" }
        do: [ { close: true } ]
    fallback:
      send: "-bash: ${argv0}: command not found\n"
