# Example track (from the build plan). `fs_add` and the fake filesystem arrive
# with the SSH plugin in Phase 2; here wget/curl only flags + fakes output.
name: ssh-linux-gateway
vars:
  failed_logins: 0
  cwd: /home/admin
start: auth

states:
  auth:
    on:
      - match: { event: auth_attempt }
        when: "failed_logins < 3"
        do:
          - set: { failed_logins: "failed_logins + 1" }
          - delay: 800ms..1500ms
          - auth: false
      - match: { event: auth_attempt }
        do:
          - tag: auth_success
          - delay: 400ms
          - auth: true
          - goto: shell
    fallback:
      close: true

  shell:
    on:
      - match: { command: "^whoami$" }
        do: [ { send: "admin\n" } ]
      - match: { command: "^uname -a$" }
        do: [ { send: "Linux plc-gw-03 5.15.0-91-generic #101-Ubuntu SMP x86_64 GNU/Linux\n" } ]
      - match: { command: "^cd (?P<dir>\\S+)$" }
        do: [ { set: { cwd: "${dir}" } } ]
      - match: { command: "^pwd$" }
        do: [ { send: "${cwd}\n" } ]
      - match: { command: "^(wget|curl) (?P<url>\\S+)" }
        do:
          - tag: payload_fetch
          - delay: 2s..4s
          - send: "Saving to: '${basename(url)}'\n100%[=====>] 48.2K  --.-KB/s  in 0.3s\n"
      - match: { command: "^(exit|logout)$" }
        do: [ { close: true } ]
    fallback:
      send: "-bash: ${argv0}: command not found\n"
