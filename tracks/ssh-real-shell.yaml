# Example track: let people in after three failures and give them a real shell
# in a sandbox (see docs/design/container-backend.md). The track still decides
# who gets in and how it feels; once `open_shell` is granted, the shell's own
# prompt, output and errors are what the attacker sees, and every byte is
# logged. Needs a shell backend wired into the SSH plugin.
name: ssh-real-shell
vars:
  failed_logins: 0
start: auth

states:
  auth:
    on:
      - match: { event: auth_attempt }
        when: "failed_logins < 3"
        do:
          - set: { failed_logins: "failed_logins + 1" }
          - delay: 800ms..1500ms
          - auth: false
      - match: { event: auth_attempt }
        do:
          - tag: auth_success
          - delay: 400ms
          - auth: true
          - open_shell: true
    fallback:
      close: true
